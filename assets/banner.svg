<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1A2980" />
            <stop offset="100%" stop-color="#26D0CE" />
        </linearGradient>
    </defs>
    <rect width="800" height="200" fill="url(#bg-grad)" rx="15" />
    <text x="400" y="90" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">
        Awesome AI Vaccine Design Engineer
    </text>
    <text x="400" y="140" font-family="Arial, sans-serif" font-size="24" fill="#e0f7fa" text-anchor="middle">
        Interview Q&amp;A
    </text>
    <!-- Dynamic animated circles to represent molecular / tech aspect -->
    <circle cx="100" cy="100" r="40" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20, 10">
        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="100" r="25" fill="none" stroke="#e0f7fa" stroke-width="2" stroke-dasharray="10, 5">
        <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="100" r="40" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20, 10">
        <animateTransform attributeName="transform" type="rotate" from="360 700 100" to="0 700 100" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="100" r="25" fill="none" stroke="#e0f7fa" stroke-width="2" stroke-dasharray="10, 5">
        <animateTransform attributeName="transform" type="rotate" from="0 700 100" to="360 700 100" dur="8s" repeatCount="indefinite" />
    </circle>
</svg>
